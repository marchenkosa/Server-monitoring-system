{% extends "base.html" %}

{% block title %}Серверы - Система Мониторинга{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Серверы</h1>
    <div class="btn-toolbar mb-2 mb-md-0">
        <button type="button" class="btn btn-sm btn-outline-primary" onclick="refreshServers()">
            <i class="fas fa-sync-alt"></i> Обновить
        </button>
    </div>
</div>

<!-- Список серверов (верхняя треть) -->
<div class="row mb-4">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title">Список серверов</h5>
            </div>
            <div class="card-body">
                <div id="serversContainer" class="row">
                    <!-- Серверы загружаются через JS -->
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Графики метрик (нижняя часть) -->
<div class="row" id="metricsCharts" style="display: none;">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title" id="selectedServerName"></h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <canvas id="cpuChart" height="300"></canvas>
                    </div>
                    <div class="col-md-6">
                        <canvas id="memoryChart" height="300"></canvas>
                    </div>
                </div>
                <div class="row mt-4">
                    <div class="col-md-6">
                        <canvas id="diskChart" height="300"></canvas>
                    </div>
                    <div class="col-md-6">
                        <canvas id="networkChart" height="300"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="noServerSelected" class="alert alert-info text-center">
    Выберите сервер для просмотра графиков метрик
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="{{ url_for('static', filename='js/servers.js') }}"></script>
{% endblock %}
